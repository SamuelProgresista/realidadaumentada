<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrdenApp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --accent: #c8ff00;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --border: #2e2e2e;
    --red: #ff4444;
    --yellow: #ffcc00;
    --green: #00e676;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .logo {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .header-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* MAIN LAYOUT */
  .main { padding: 20px; max-width: 500px; margin: 0 auto; }

  /* CAMERA SECTION */
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #canvas-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .camera-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
  }
  .camera-placeholder .icon {
    font-size: 3rem;
    opacity: 0.4;
  }
  .camera-placeholder p {
    font-size: 0.85rem;
    font-family: 'Space Mono', monospace;
  }

  /* SCANNING OVERLAY */
  .scan-overlay {
    position: absolute;
    inset: 0;
    background: rgba(200,255,0,0.05);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .scan-overlay.active { display: flex; }
  .scan-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scanDown 1.8s ease-in-out infinite;
  }
  @keyframes scanDown {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(300px); opacity: 0; }
  }
  .scan-text {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* BUTTONS */
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* SCORE CARD */
  .score-card {
    margin-top: 20px;
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
    display: none;
    animation: fadeUp 0.4s ease;
  }
  .score-card.show { display: block; }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to { opacity:1; transform: translateY(0); }
  }
  .score-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .score-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .score-number {
    font-size: 3rem;
    font-weight: 800;
    line-height: 1;
    transition: color 0.5s;
  }
  .score-bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1), background 0.5s;
  }
  .score-verdict {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ITEMS SECTION */
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin: 20px 0 10px;
  }

  .items-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    animation: fadeUp 0.4s ease both;
  }
  .item-emoji {
    font-size: 1.6rem;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .item-body { flex: 1; }
  .item-name {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 2px;
  }
  .item-category {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .item-suggestion {
    font-size: 0.8rem;
    color: #aaa;
    line-height: 1.4;
  }
  .item-suggestion::before {
    content: '→ ';
    color: var(--accent2);
    font-weight: 700;
  }

  /* SUMMARY */
  .summary-box {
    margin-top: 16px;
    background: var(--surface2);
    border-radius: 12px;
    padding: 16px;
    border-left: 3px solid var(--accent);
    font-size: 0.85rem;
    line-height: 1.6;
    color: #ccc;
    display: none;
  }
  .summary-box.show { display: block; animation: fadeUp 0.4s ease; }

  /* CATEGORY CHIPS */
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .chip {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 5px 10px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chip.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    line-height: 1.8;
  }
  .empty-state .big { font-size: 2.5rem; margin-bottom: 10px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 30px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    border: 1px solid var(--border);
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* HISTORY MINI */
  .history-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .history-strip::-webkit-scrollbar { display: none; }
  .history-thumb {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .history-thumb:hover { border-color: var(--accent); }

  /* Loading dots */
  .dots span {
    animation: blink 1.4s infinite;
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    color: var(--accent);
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
</style>
</head>
<body>

<div class="header">
  <div class="logo">orden<span>.</span>app</div>
  <div class="header-badge">BETA · IA VISION</div>
</div>

<div class="main">

  <!-- CAMERA -->
  <div class="camera-wrap" id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-overlay"></canvas>
    <div class="camera-placeholder" id="placeholder">
      <div class="icon">📷</div>
      <p>Pulsa "Activar cámara"</p>
    </div>
    <div class="scan-overlay" id="scanOverlay">
      <div class="scan-line"></div>
      <div class="dots"><span>.</span><span>.</span><span>.</span></div>
      <div class="scan-text">Analizando espacio</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="btnCamera" onclick="startCamera()">📷 Activar cámara</button>
    <button class="btn btn-primary" id="btnAnalyze" onclick="analyzeFrame()" disabled>🔍 Analizar</button>
  </div>

  <!-- SCORE -->
  <div class="score-card" id="scoreCard">
    <div class="score-header">
      <div>
        <div class="score-label">Puntuación de orden</div>
        <div class="score-number" id="scoreNum">—</div>
      </div>
      <div style="text-align:right">
        <div class="score-label">Valoración</div>
        <div id="scoreEmoji" style="font-size:2.2rem">🤔</div>
      </div>
    </div>
    <div class="score-bar-track">
      <div class="score-bar-fill" id="scoreBar" style="width:0%"></div>
    </div>
    <div class="score-verdict" id="scoreVerdict">—</div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-box" id="summaryBox"></div>

  <!-- ITEMS -->
  <div id="resultsSection" style="display:none">
    <div class="section-title">Ítems detectados</div>
    <div class="chips-row" id="chipsRow"></div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <!-- EMPTY -->
  <div class="empty-state" id="emptyState">
    <div class="big">🧹</div>
    Activa la cámara y pulsa<br><strong>Analizar</strong> para empezar
  </div>

  <!-- HISTORY -->
  <div id="historySection" style="display:none; margin-top:24px">
    <div class="section-title">Últimos análisis</div>
    <div class="history-strip" id="historyStrip"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = {
  'ropa': { emoji: '👕', color: '#ff6b9d' },
  'papeles': { emoji: '📄', color: '#ffcc00' },
  'comida': { emoji: '🍎', color: '#ff6b35' },
  'electrónica': { emoji: '💻', color: '#4fc3f7' },
  'libros': { emoji: '📚', color: '#ce93d8' },
  'higiene': { emoji: '🧴', color: '#80cbc4' },
  'utensilios': { emoji: '🍴', color: '#ffab40' },
  'objetos': { emoji: '📦', color: '#90a4ae' },
  'basura': { emoji: '🗑️', color: '#ef9a9a' },
  'decoración': { emoji: '🎨', color: '#a5d6a7' },
};

let stream = null;
let analyzing = false;
let history = JSON.parse(localStorage.getItem('ordenapp_history') || '[]');
let allItems = [];
let activeFilter = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('btnCamera').textContent = '✅ Cámara activa';
    document.getElementById('btnCamera').disabled = true;
    document.getElementById('btnAnalyze').disabled = false;
    showToast('Cámara activada');
  } catch(e) {
    showToast('Error al acceder a la cámara');
  }
}

function captureFrame() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
}

async function analyzeFrame() {
  if (analyzing || !stream) return;
  analyzing = true;

  const b64 = captureFrame();

  // Show scanning UI
  document.getElementById('scanOverlay').classList.add('active');
  document.getElementById('btnAnalyze').disabled = true;
  document.getElementById('emptyState').style.display = 'none';

  const prompt = `Eres un asistente de organización del hogar con visión artificial. Analiza esta imagen de una mesa/habitación/espacio.

Responde ÚNICAMENTE en JSON sin markdown ni backticks, con esta estructura exacta:
{
  "score": <número del 0 al 100 indicando el nivel de orden, donde 0=caos total y 100=perfecto orden>,
  "verdict": "<frase corta de 4-8 palabras que describa el estado del espacio>",
  "summary": "<párrafo breve de 2-3 frases con observación general del espacio y consejo motivacional>",
  "items": [
    {
      "name": "<nombre del objeto>",
      "category": "<una de: ropa, papeles, comida, electrónica, libros, higiene, utensilios, objetos, basura, decoración>",
      "suggestion": "<dónde o cómo guardar/organizar este ítem, en 1 frase corta>"
    }
  ]
}

Detecta todos los objetos visibles (mínimo 3, máximo 12). Sé específico con los nombres. Las sugerencias deben ser prácticas y amables.`;

  try {
    const response = await fetch('https://mute-recipe-3fcc.samuel-aguilar-aguilo.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });

    const data = await response.json();
    const text = data.content?.find(c => c.type === 'text')?.text || '';
    
    let result;
    try {
      result = JSON.parse(text.replace(/```json|```/g, '').trim());
    } catch {
      throw new Error('No se pudo parsear la respuesta');
    }

    renderResults(result, b64);
    saveHistory(b64, result.score);

  } catch(err) {
    showToast('Error al analizar. Intenta de nuevo.');
    console.error(err);
  } finally {
    document.getElementById('scanOverlay').classList.remove('active');
    document.getElementById('btnAnalyze').disabled = false;
    analyzing = false;
  }
}

function renderResults(data, thumb) {
  // Score
  const score = data.score || 0;
  const scoreCard = document.getElementById('scoreCard');
  scoreCard.classList.add('show');

  setTimeout(() => {
    const el = document.getElementById('scoreNum');
    animateNumber(el, 0, score, 800);
    document.getElementById('scoreBar').style.width = score + '%';

    const bar = document.getElementById('scoreBar');
    const emoji = document.getElementById('scoreEmoji');
    const verdict = document.getElementById('scoreVerdict');

    if (score >= 75) {
      bar.style.background = '#00e676';
      emoji.textContent = '🌟';
      el.style.color = '#00e676';
    } else if (score >= 45) {
      bar.style.background = '#ffcc00';
      emoji.textContent = '💪';
      el.style.color = '#ffcc00';
    } else {
      bar.style.background = '#ff4444';
      emoji.textContent = '🧹';
      el.style.color = '#ff4444';
    }
    verdict.textContent = data.verdict || '';
  }, 100);

  // Summary
  const sumBox = document.getElementById('summaryBox');
  sumBox.textContent = data.summary || '';
  sumBox.classList.add('show');

  // Items
  allItems = data.items || [];
  activeFilter = null;
  renderItems(allItems);
  buildChips(allItems);
  document.getElementById('resultsSection').style.display = 'block';

  // Draw bounding boxes (simulated positions)
  drawOverlay(allItems);
}

function renderItems(items) {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';
  items.forEach((item, i) => {
    const catKey = item.category?.toLowerCase() || 'objetos';
    const catInfo = CATEGORIES[catKey] || CATEGORIES['objetos'];
    const card = document.createElement('div');
    card.className = 'item-card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <div class="item-emoji">${catInfo.emoji}</div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-category" style="color:${catInfo.color}">${item.category}</div>
        <div class="item-suggestion">${item.suggestion}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function buildChips(items) {
  const row = document.getElementById('chipsRow');
  row.innerHTML = '';
  
  const cats = [...new Set(items.map(i => i.category?.toLowerCase()).filter(Boolean))];
  
  const allChip = document.createElement('div');
  allChip.className = 'chip active';
  allChip.textContent = 'Todos';
  allChip.onclick = () => filterItems(null, allChip);
  row.appendChild(allChip);

  cats.forEach(cat => {
    const catInfo = CATEGORIES[cat] || CATEGORIES['objetos'];
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = catInfo.emoji + ' ' + cat;
    chip.onclick = () => filterItems(cat, chip);
    row.appendChild(chip);
  });
}

function filterItems(cat, chipEl) {
  activeFilter = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chipEl.classList.add('active');
  const filtered = cat ? allItems.filter(i => i.category?.toLowerCase() === cat) : allItems;
  renderItems(filtered);
}

function drawOverlay(items) {
  const canvas = document.getElementById('canvas-overlay');
  const wrap = document.getElementById('cameraWrap');
  canvas.width = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw simulated boxes spread across the camera view
  const positions = generatePositions(items.length, canvas.width, canvas.height);
  items.forEach((item, i) => {
    const catKey = item.category?.toLowerCase() || 'objetos';
    const catInfo = CATEGORIES[catKey] || CATEGORIES['objetos'];
    const pos = positions[i];
    
    ctx.strokeStyle = hexToRgba(catInfo.color || '#c8ff00', 0.9);
    ctx.lineWidth = 2;
    ctx.strokeRect(pos.x, pos.y, pos.w, pos.h);
    
    // Label bg
    ctx.fillStyle = hexToRgba(catInfo.color || '#c8ff00', 0.85);
    const label = catInfo.emoji + ' ' + item.name;
    ctx.font = 'bold 11px Syne, sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillRect(pos.x, pos.y - 20, tw + 10, 20);
    
    // Label text
    ctx.fillStyle = '#000';
    ctx.fillText(label, pos.x + 5, pos.y - 5);
  });
}

function generatePositions(n, w, h) {
  const positions = [];
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const cellW = w / cols;
  const cellH = h / rows;
  
  for (let i = 0; i < n; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const padding = 10;
    const bw = cellW - padding * 2 - Math.random() * 20;
    const bh = cellH - padding * 2 - Math.random() * 20;
    positions.push({
      x: col * cellW + padding + Math.random() * 10,
      y: row * cellH + padding + 20 + Math.random() * 10,
      w: bw,
      h: bh
    });
  }
  return positions;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function animateNumber(el, from, to, duration) {
  const start = performance.now();
  function update(now) {
    const t = Math.min((now - start) / duration, 1);
    el.textContent = Math.round(from + (to - from) * easeOut(t));
    if (t < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function saveHistory(b64, score) {
  history.unshift({ thumb: 'data:image/jpeg;base64,' + b64, score, date: new Date().toLocaleDateString('es-ES') });
  if (history.length > 5) history = history.slice(0, 5);
  try { localStorage.setItem('ordenapp_history', JSON.stringify(history)); } catch(e) {}
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) return;
  document.getElementById('historySection').style.display = 'block';
  const strip = document.getElementById('historyStrip');
  strip.innerHTML = '';
  history.forEach(h => {
    const img = document.createElement('img');
    img.className = 'history-thumb';
    img.src = h.thumb;
    img.title = `Puntuación: ${h.score} · ${h.date}`;
    strip.appendChild(img);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init history on load
renderHistory();
if (history.length > 0) document.getElementById('historySection').style.display = 'block';
</script>
</body>
